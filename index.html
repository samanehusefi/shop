<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>فروشگاه اینترنتی دیجی کالا</title>
    <meta name="description"
          content="هر آنچه که نیاز دارید با بهترین قیمت از دیجی&zwnj;کالا بخرید! جدیدترین انواع گوشی موبایل، لپ تاپ، لباس، لوازم آرایشی و بهداشتی، کتاب، لوازم خانگی، خودرو و... با امکان تعویض و مرجوعی آسان | ✓ارسال رايگان ✓پرداخت در محل ✓ضمانت بازگشت کالا - برای خرید کلیک کنید!">
    <link rel="icon" href="/src/assets/logo/fav.ico" type="image/x-icon">
</head>
<body>
<!-- Loading -->
<div id="loading"
     class="fixed inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-50 hidden transition-opacity duration-700">
    <img src="src/assets/logo/full-horizontal.svg" class="h-20 w-40 animate-bounce" alt="Logo"/>
    <p class="mt-4 text-gray-600 text-lg">در حال بارگذاری...</p>
</div>

<!--header-->
<header class="w-full" id="header"></header>
<!--Main-->
<main class="w-full flex1">
    <!--#region Slider-->
    <section class="flex flex-wrap">
        <div class="w-full h-[400px] lg:h-[600px]">
            <swiper-container class="mySwiper" pagination="true" space-between="30"
                              centered-slides="true" autoplay-delay="2000">
            </swiper-container>
        </div>
    </section>
    <!--#endregion Slider-->
    <!--#region Amazing pro-->
    <section class="amazing-section">
        <div class="amazing-box shadow flex flex-col md:flex-row">
            <!-- Right Side -->
            <div class="amazing-right-box w-full md:w-auto">
                <img src="./src/assets/amazingpro/image-1.svg" class="img-title hidden md:block"/>
                <div class="flex px-3 justify-between">
                    <img src="./src/assets/amazingpro/persent.svg" class="w-8 md:hidden"/>
                    <img src="./src/assets/amazingpro/amaz.svg" class="img-title mx-2 md:hidden"/>
                    <div class="amazing-timer-box">
                        <div class="amazing-timer-box">
                            <div id="seconds" class="amazing-timer">00</div>
                            <span class="px-1">:</span>
                            <div id="minutes" class="amazing-timer">00</div>
                            <span class="px-1">:</span>
                            <div id="hours" class="amazing-timer">00</div>
                        </div>
                    </div>
                </div>
                <img src="./src/assets/amazingpro/persent.svg" class="w-14 hidden md:block"/>
                <a href="https://www.digikala.com/incredible-offers/" class="more-amazing">
                    <span id="showAllPro">مشاهده همه</span>
                    <img src="./src/assets/amazingpro/flash.svg"/>
                </a>
            </div>
            <!-- Slider -->
            <div class="amazing-slider-pro w-full">
                <swiper-container
                        class="w-full h-full amazing-products"
                        slides-per-view="7"
                        space-between="5"
                        dir="rtl"
                        autoplay-delay="2500"
                        breakpoints='{
                                        "135": { "slidesPerView": 1 },
                                        "240": { "slidesPerView": 2 },
                                        "320": { "slidesPerView": 2 },
                                        "640": { "slidesPerView": 3 },
                                        "1024": { "slidesPerView": 4 },
                                        "1280": { "slidesPerView": 7 }
                                      }'
                        style="display:block; width:100%; height:100%; padding:10px;">
                </swiper-container>
            </div>
        </div>
    </section>
    <!--#endregion Amazing pro-->
    <!--#region Fresh pro-->
    <section class="relative mx-auto max-w-7xl px-4 mt-2 overflow-hidden rounded-2xl ">
        <div class="relative flex flex-col bg-[#eceeee] lg:flex-row lg:items-center lg:justify-between px-6 py-4 rounded-2xl gap-4">
            <div class="flex items-center gap-4 shrink-0">
                <img src="/src/assets/icon/fresh.png" alt="fresh" class="w-12 h-12"/>
                <h2 class=" text-sm md:text-xl font-bold text-[#029a49]">
                    شگفت‌انگیز سوپرمارکتی
                </h2>
                <span class="rounded-full bg-[#029a49] px-2 md:px-4 py-1 md:py-2 text-xs md:text-sm font-bold text-white">
                تا ۴۰٪ تخفیف
            </span>
            </div>
            <!-- Products -->
            <div class="fresh_product-list mt-3 lg:mt-0 flex flex-wrap items-center justify-center lg:justify-end gap-3 w-full">
            </div>
        </div>
        </div>
    </section>
    <!--#endregion Fresh pro-->
    <!--#region hero_banner-->
    <section class="max-w-7xl mx-auto my-6  py-6">
        <ul class="banner_list" id="hero_banner_list"></ul>
    </section>
    <!--#endregion hero_banner-->
<!--    <section class=" my-6  bg-neutral-100 px-5 py-6"></section>-->

    <!--#endregion category-->
    <section class="py-8 mx-auto max-w-7xl">
        <h2 class="text-center text-xl font-bold mb-8">
            خرید بر اساس دسته‌بندی
        </h2>

        <swiper-container
                class="categories-swiper Categories-list"
                slides-per-view="1"
                space-between="20"
                navigation="true">


            <div slot="container-end">
                <div class="swiper-button-next hidden"></div>
                <div class="swiper-button-prev hidden"></div>
            </div>
        </swiper-container>
    </section>
    <!--#endregion category-->
    <!--#region campaign_banner-->
    <section class="max-w-7xl mx-auto my-6  py-6">
        <ul class="banner_list" id="campaign_banner_list"></ul>
    </section>
    <!--#endregion campaign_banner-->


    <!--#endregion brands-->
    <section class="py-8 mx-auto max-w-7xl border border-gray-300 rounded-2xl">
        <h2 class="text-center text-xl font-bold mb-8">
            محبوب‌ترین برندها
        </h2>

        <swiper-container
                class="brands-swiper brands-list bg-transparent"
                slides-per-view="1"
                space-between="20"
                navigation="true">


            <div slot="container-end">
                <div class="swiper-button-next hidden"></div>
                <div class="swiper-button-prev hidden"></div>
            </div>
        </swiper-container>
    </section>
    <!--#endregion brands-->

    <!--#region promo_banner-->
    <section class="max-w-7xl mx-auto my-6  py-6">
        <ul class="promo_banner_list" id="promo_banner_list"></ul>
    </section>
    <!--#endregion promo_banner-->

                <h2 class="font-semibold text-sm">خواندنی‌ها </h2>
            </div>
            <a class="flex justify-end text-xs text-[#1672dd] items-center" href="https://www.digikala.com/mag/">
